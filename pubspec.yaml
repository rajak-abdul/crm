name: crm_app
description: CRM Mobile App with Cubit State Management
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  image_picker: ^1.0.4
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  sqflite: ^2.4.2
  file_picker: 10.3.10
  url_launcher: ^6.3.2
  open_file: ^3.5.11
  path_provider: ^2.1.5
  gal: ^1.1.0
  file_saver: ^0.2.8
  device_info_plus: ^11.5.0
  permission_handler: ^12.0.1
  connectivity_plus: ^5.0.2
  intl_phone_field: ^3.2.0
  phone_numbers_parser: ^9.0.22
  uuid: ^4.5.3
  geolocator: ^14.0.2
  just_audio: ^0.10.5
  excel: ^4.0.6
  flutter_local_notifications: ^19.4.2
  geocoding: ^4.0.0
  html_editor_enhanced: ^2.7.1
  flutter_widget_from_html: ^0.17.3
  video_player: ^2.10.0
  syncfusion_flutter_calendar: ^29.2.5
  jwt_decoder: ^2.0.1
  socket_io_client: ^2.0.3+1
  emoji_picker_flutter: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.1
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/splash_screen.mp4